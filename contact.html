<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Contact SJ Mara."><title>Contact | SJ Mara</title><style>
:root{--ink:#172521;--muted:#64736d;--paper:#f7f7f2;--green:#245c4b;--lime:#d7e8a4;--line:#dfe5dc}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit}.header{position:sticky;top:0;background:#173e35;color:white;z-index:5}.nav-wrap{width:min(1120px,92%);min-height:72px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:bold 24px Georgia,serif;text-decoration:none;white-space:nowrap}nav{display:flex;align-items:center;gap:22px}nav a{font-size:13px;font-weight:bold;text-decoration:none;color:white}nav a:hover,nav a[aria-current=page]{color:var(--lime)}.admin{border:1px solid var(--lime);padding:7px 11px;border-radius:4px;color:var(--lime)}.toggle{display:none;background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:4px;padding:8px 12px}.container{width:min(850px,92%);margin:auto}.page{min-height:68vh;padding:75px 0}.label{color:var(--green);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.page h1{font:clamp(38px,6vw,58px)/1.1 Georgia,serif;margin:8px 0 18px}.intro{color:var(--muted);max-width:620px}.card{margin-top:28px;background:#fff;border:1px solid var(--line);padding:30px}.card h2{font:28px Georgia,serif;margin-bottom:8px}.card p{color:var(--muted)}.button{display:inline-block;margin-top:18px;background:var(--green);color:white;padding:12px 18px;border-radius:4px;text-decoration:none;font-size:13px;font-weight:bold}.button:hover{background:#173e35}footer{background:#14251f;color:#cbd6cc;text-align:center;padding:22px;font-size:12px}footer a{color:white;text-decoration:none}@media(max-width:800px){.nav-wrap{position:relative}.toggle{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:#173e35;padding:18px;align-items:flex-start;flex-direction:column;gap:15px}nav.open{display:flex}}
</style></head><body><header class="header"><div class="nav-wrap"><a class="brand" href="./index.html">SJ Mara</a><button class="toggle" aria-expanded="false" aria-controls="site-nav" type="button">Menu</button><nav id="site-nav" aria-label="Main navigation"><a href="./index.html">Home</a><a href="./gallery.html">My Gallery</a><a href="./blog.html">My Blog</a><a href="./explore.html">Explore</a><a href="./contact.html" aria-current="page">Contact</a><a class="admin" href="./admin/">Admin sign in</a></nav></div></header><main class="page"><div class="container"><p class="label">Say hello</p><h1>Contact</h1><p class="intro">Have a question, a story to share, or just want to connect? I’d love to hear from you.</p><section class="card"><h2>Let’s connect.</h2><p>Send me an email and I’ll get back to you as soon as I can.</p><a class="button" href="mailto:your-email@example.com">Send an email ↗</a></section></div></main><footer>© <span id="year"></span> SJ Mara. Made with care. · <a href="./index.html">Home</a></footer><script>document.getElementById('year').textContent=new Date().getFullYear();const t=document.querySelector('.toggle'),n=document.getElementById('site-nav');t.addEventListener('click',()=>{const open=n.classList.toggle('open');t.setAttribute('aria-expanded',String(open))});n.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>n.classList.remove('open')));</script></body></html>
