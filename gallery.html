<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Browse SJ Mara's published photos and videos from Micronesia."><title>My Gallery | SJ Mara</title><style>
:root{--ink:#172521;--muted:#64736d;--paper:#f7f7f2;--green:#245c4b;--lime:#d7e8a4;--line:#dfe5dc}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit}.header{position:sticky;top:0;background:#173e35;color:white;z-index:5}.nav-wrap{width:min(1120px,92%);min-height:72px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:bold 24px Georgia,serif;text-decoration:none;white-space:nowrap}nav{display:flex;align-items:center;gap:22px}nav a{font-size:13px;font-weight:bold;text-decoration:none;color:white}nav a:hover,nav a[aria-current=page]{color:var(--lime)}.admin{border:1px solid var(--lime);padding:7px 11px;border-radius:4px;color:var(--lime)}.toggle{display:none;background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:4px;padding:8px 12px}.container{width:min(1120px,92%);margin:auto}.page{padding:65px 0 80px}.label{color:var(--green);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.heading h1{font:clamp(36px,6vw,54px)/1.1 Georgia,serif;margin:7px 0}.heading>p{max-width:400px;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.item{min-height:280px;background:#dce8df;overflow:hidden;position:relative}.item img,.item video{width:100%;height:100%;min-height:280px;object-fit:cover;display:block}.item figcaption{position:absolute;inset:auto 0 0;padding:35px 18px 16px;color:#fff;font:20px Georgia,serif;background:linear-gradient(transparent,#10231dcc)}.empty{grid-column:1/-1;color:var(--muted);padding:20px;background:#fff;border:1px solid var(--line)}.error{color:#803626;margin-top:15px}footer{background:#14251f;color:#cbd6cc;text-align:center;padding:22px;font-size:12px}footer a{color:white;text-decoration:none}@media(max-width:800px){.nav-wrap{position:relative}.toggle{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:#173e35;padding:18px;align-items:flex-start;flex-direction:column;gap:15px}nav.open{display:flex}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.item,.item img,.item video{min-height:250px}}
</style></head><body><header class="header"><div class="nav-wrap"><a class="brand" href="./index.html">SJ Mara</a><button class="toggle" aria-expanded="false" aria-controls="site-nav" type="button">Menu</button><nav id="site-nav" aria-label="Main navigation"><a href="./index.html">Home</a><a href="./gallery.html" aria-current="page">My Gallery</a><a href="./blog.html">My Blog</a><a href="./explore.html">Explore</a><a href="./contact.html">Contact</a><a class="admin" href="./admin/">Admin sign in</a></nav></div></header><main class="page"><div class="container"><div class="heading"><div><p class="label">A few moments</p><h1>My Gallery</h1></div><p>Published photos and videos from the islands.</p></div><div class="grid" id="gallery" aria-live="polite"><p class="empty">Loading gallery…</p></div><p class="error" id="error" hidden></p></div></main><footer>© <span id="year"></span> SJ Mara. Made with care. · <a href="./index.html">Home</a></footer><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://oyfearfdtyfqlvoxixpi.supabase.co','sb_publishable_WjFfVN6IpnYSdlfVmoX5rg_BTRf0Ax5');const $=id=>document.getElementById(id);$('year').textContent=new Date().getFullYear();const t=document.querySelector('.toggle'),n=$('site-nav');t.addEventListener('click',()=>{const open=n.classList.toggle('open');t.setAttribute('aria-expanded',String(open))});n.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>n.classList.remove('open')));function publicUrl(p){if(p.image_url)return p.image_url;if(p.image_path)return supabase.storage.from('site-media').getPublicUrl(p.image_path).data.publicUrl;return''}function isVideo(url){return/\.(mp4|webm|ogg|mov)(\?|$)/i.test(url)}try{const{data,error}=await supabase.from('photos').select('*').eq('published',true).order('created_at',{ascending:false});if(error)throw error;const grid=$('gallery');grid.replaceChildren();if(!data?.length){const empty=document.createElement('p');empty.className='empty';empty.textContent='No photos or videos published yet.';grid.append(empty)}for(const p of data||[]){const fig=document.createElement('figure');fig.className='item';const url=publicUrl(p);if(url){const media=document.createElement(isVideo(url)?'video':'img');media.src=url;if(media.tagName==='VIDEO'){media.controls=true;media.preload='metadata';media.setAttribute('aria-label',p.title||p.caption||'Island video')}else{media.alt=p.title||p.caption||'Island photo';media.loading='lazy'}fig.append(media)}const cap=document.createElement('figcaption');cap.textContent=p.title||p.caption||'Island moment';fig.append(cap);grid.append(fig)}}catch(e){$('gallery').innerHTML='<p class="empty">Gallery is temporarily unavailable.</p>';$('error').hidden=false;$('error').textContent=e.message||'Could not load gallery.'}
</script></body></html>
