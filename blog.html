<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Read SJ Mara's published articles and island stories."><title>My Blog | SJ Mara</title><style>
:root{--ink:#172521;--muted:#64736d;--paper:#f7f7f2;--green:#245c4b;--lime:#d7e8a4;--line:#dfe5dc}*{box-sizing:border-box}body{margin:0;font:16px/1.6 Arial,sans-serif;background:var(--paper);color:var(--ink)}a{color:inherit}.header{position:sticky;top:0;background:#173e35;color:white;z-index:5}.nav-wrap{width:min(1120px,92%);min-height:72px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font:bold 24px Georgia,serif;text-decoration:none;white-space:nowrap}nav{display:flex;align-items:center;gap:22px}nav a{font-size:13px;font-weight:bold;text-decoration:none;color:white}nav a:hover,nav a[aria-current=page]{color:var(--lime)}.admin{border:1px solid var(--lime);padding:7px 11px;border-radius:4px;color:var(--lime)}.toggle{display:none;background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:4px;padding:8px 12px}.container{width:min(1000px,92%);margin:auto}.page{padding:65px 0 80px}.label{color:var(--green);font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.heading h1{font:clamp(36px,6vw,54px)/1.1 Georgia,serif;margin:7px 0}.heading>p{max-width:400px;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{background:#fff;border:1px solid var(--line);padding:28px}.card h2{font:26px/1.2 Georgia,serif;margin:10px 0 12px}.card img{width:100%;max-height:300px;object-fit:cover;margin:12px 0}.body{white-space:pre-line;color:var(--muted);font-size:15px}.empty{grid-column:1/-1;color:var(--muted);padding:20px;background:#fff;border:1px solid var(--line)}.error{color:#803626;margin-top:15px}footer{background:#14251f;color:#cbd6cc;text-align:center;padding:22px;font-size:12px}footer a{color:white;text-decoration:none}@media(max-width:800px){.nav-wrap{position:relative}.toggle{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:#173e35;padding:18px;align-items:flex-start;flex-direction:column;gap:15px}nav.open{display:flex}}@media(max-width:560px){.grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="header"><div class="nav-wrap"><a class="brand" href="./index.html">SJ Mara</a><button class="toggle" aria-expanded="false" aria-controls="site-nav" type="button">Menu</button><nav id="site-nav" aria-label="Main navigation"><a href="./index.html">Home</a><a href="./gallery.html">My Gallery</a><a href="./blog.html" aria-current="page">My Blog</a><a href="./explore.html">Explore</a><a href="./contact.html">Contact</a><a class="admin" href="./admin/">Admin sign in</a></nav></div></header><main class="page"><div class="container"><div class="heading"><div><p class="label">Notes &amp; stories</p><h1>My Blog</h1></div><p>Published thoughts, experiences, and stories from life and across the islands.</p></div><div class="grid" id="articles" aria-live="polite"><p class="empty">Loading stories…</p></div><p class="error" id="error" hidden></p></div></main><footer>© <span id="year"></span> SJ Mara. Made with care. · <a href="./index.html">Home</a></footer><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://oyfearfdtyfqlvoxixpi.supabase.co','sb_publishable_WjFfVN6IpnYSdlfVmoX5rg_BTRf0Ax5');const $=id=>document.getElementById(id);$('year').textContent=new Date().getFullYear();const t=document.querySelector('.toggle'),n=$('site-nav');t.addEventListener('click',()=>{const open=n.classList.toggle('open');t.setAttribute('aria-expanded',String(open))});n.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>n.classList.remove('open')));function el(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=content||'';return e}try{const{data,error}=await supabase.from('articles').select('title,topic,excerpt,content,image_url,created_at').eq('published',true).order('created_at',{ascending:false});if(error)throw error;const grid=$('articles');grid.replaceChildren();if(!data?.length)grid.append(el('p','empty','No stories published yet.'));for(const a of data||[]){const card=el('article','card');card.append(el('p','label',a.topic||'Island stories'));card.append(el('h2','',a.title||'Untitled'));if(a.image_url){const img=document.createElement('img');img.src=a.image_url;img.alt=a.title||'';img.loading='lazy';card.append(img)}card.append(el('p','body',a.content||a.excerpt||''));grid.append(card)}}catch(e){$('articles').innerHTML='<p class="empty">Stories are temporarily unavailable.</p>';$('error').hidden=false;$('error').textContent=e.message||'Could not load articles.'}
</script></body></html>
